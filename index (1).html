<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Itinerario Promociona</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: columna móvil de app; escalera de tres peldaños en azul marino de marca, cada uno con el logo y el color de su programa */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#182B4C; --muted:#5E6A80; --line:#DDE2EA; --soft:#EBEEF4;
  --navy:#182B4C; --on-navy:#FFFFFF; --gold:#CFB546; --accent:#182B4C;
  --c-proactiva:#7F9F77; --c-progresa:#E35A8D; --c-promociona:#1A9FDF; --c-consejeras:#D72318;
  --live:#1A9FDF;
  --f-display:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#162038; --ink:#E7EBF2; --muted:#9AA5B8; --line:#25314B; --soft:#1C2741;
  --navy:#22345A; --on-navy:#FFFFFF; --gold:#D9C164; --accent:#E7EBF2;
  --c-proactiva:#9BBB92; --c-progresa:#EF7AA4; --c-promociona:#45B6EC; --c-consejeras:#EE4D40;
  --live:#45B6EC; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#162038; --ink:#E7EBF2; --muted:#9AA5B8; --line:#25314B; --soft:#1C2741;
  --navy:#22345A; --on-navy:#FFFFFF; --gold:#D9C164; --accent:#E7EBF2;
  --c-proactiva:#9BBB92; --c-progresa:#EF7AA4; --c-promociona:#45B6EC; --c-consejeras:#EE4D40;
  --live:#45B6EC; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:560px;margin:0 auto;padding-block:14px 48px;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.mono{font-family:var(--f-mono)}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);
  background:var(--bg);padding-block:8px;z-index:5;border-bottom:2px solid var(--gold)}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-family:var(--f-display);font-size:17px}
.brand span{font-size:12px;color:var(--muted)}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.me{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

/* home */
.hero h1{font-size:clamp(30px,8vw,40px);line-height:1.05;font-weight:700}
.hero p{color:var(--muted);margin:8px 0 0;max-width:42ch}
.stairs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;height:250px;margin-top:4px}
.step{border:0;border-radius:6px 6px 2px 2px;padding:10px 9px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  background:var(--navy);color:var(--on-navy);border-top:5px solid var(--pc);min-width:0;transition:transform .2s ease}
.step .logo{width:46px;height:46px;border-radius:50%;background:#fff}
.step:hover{transform:translateY(-2px)}
.step .rn{font-family:var(--f-mono);font-size:12px;opacity:.9}
.step .nm{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.step .crown{font-size:10px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:1px 5px;align-self:flex-start}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.levels span{font-size:11.5px;color:var(--muted);line-height:1.25}
.axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;border-top:1px dashed var(--line);padding-top:6px;margin-top:8px}

.apart{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--c-consejeras);border-radius:4px 14px 14px 4px;padding:14px 16px}
.apart .logo{width:52px;height:52px;border-radius:50%;background:#fff}
.apart b{font-family:var(--f-display);font-size:18px;display:block;margin-top:2px}
.apart .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.apart .t > span:not(.eyebrow){font-size:13.5px;color:var(--muted)}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.section-head h2{font-size:20px}

.live{display:flex;flex-direction:column;gap:8px}
.livecard{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%}
.livecard .logo{width:52px;height:52px;border-radius:50%;background:#fff;justify-self:center}
.livecard .t{min-width:0}
.livecard .t b{display:block;font-size:15.5px}
.livecard .t span{font-size:13px;color:var(--muted)}
.next{font-size:12px;color:var(--ink);font-weight:600;margin-top:2px;display:block}
.chev{color:var(--muted);font-size:18px}

.notice{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px}
.notice p{margin:4px 0 0;font-size:14px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--on-navy);background:var(--navy)}

/* programa */
.phead{border-radius:16px;padding:20px;color:var(--on-navy);background:var(--navy);border-bottom:5px solid var(--pc);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.phead .big{position:absolute;right:-6px;bottom:-26px;font-family:var(--f-display);font-weight:700;font-size:120px;line-height:1;opacity:.12;pointer-events:none}
.phead h1{font-size:34px;font-weight:700}
.phead .logo{width:68px;height:68px;border-radius:50%;background:#fff}
.phead p{margin:0;max-width:40ch;font-size:14.5px}
.phead .eyebrow{color:inherit;opacity:.8}
.facts{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.fact{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:14px}
.fact:first-child{border-top:0}
.fact dt{color:var(--muted);font-size:12.5px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.fact dd{margin:0;min-width:0}
.eds{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ed{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-family:var(--f-display);font-weight:700;font-size:16px;text-align:center}
.ed small{display:block;font-family:var(--f-body);font-weight:500;font-size:10.5px;color:var(--muted)}
.ed:hover{border-color:var(--pc)}

/* edición */
.ehead{display:flex;flex-direction:column;gap:6px}
.ehead h1{font-size:30px;font-weight:700;line-height:1.05}
.ehead h1 em{font-style:normal;color:var(--pc)}
.ehead .row{display:flex;gap:14px;align-items:center}
.ehead .logo{width:60px;height:60px;border-radius:50%;background:#fff;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--ink);align-self:flex-start}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--live)}
.pill.alumni i{background:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px;overflow-x:auto}
.tab{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 10px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.composer{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%;border:0;resize:vertical;min-height:64px;background:transparent;color:var(--ink);font:inherit}
.composer textarea::placeholder{color:var(--muted)}
.composer .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.composer .row span{font-size:12px;color:var(--muted)}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.posts{display:flex;flex-direction:column;gap:10px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.post.pinned{border-color:var(--pc)}
.post .who{display:flex;gap:10px;align-items:center}
.post .who b{font-size:14.5px;display:block;line-height:1.2}
.post .who span{font-size:12px;color:var(--muted)}
.post p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.post .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.like{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.like[aria-pressed="true"]{color:var(--pc);border-color:var(--pc)}

.timeline{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.hito{display:grid;grid-template-columns:20px 1fr;gap:12px;padding:12px 0;position:relative}
.hito + .hito{border-top:1px solid var(--line)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--pc);margin-top:4px}
.hito.done .dot{background:var(--pc)}
.hito.now .dot{background:var(--pc);box-shadow:0 0 0 4px color-mix(in srgb, var(--pc) 25%, transparent)}
.hito b{display:block;font-size:15px}
.hito .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hito .st{font-size:12px;font-weight:600}
.hito p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.person .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--pc)}
.person b{font-size:14px;line-height:1.2}
.person span{font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px;margin:0}

.files{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.file{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.file + .file{border-top:1px solid var(--line)}
.ficon{width:40px;height:46px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;color:var(--pc)}
.file b{font-size:14.5px;display:block}
.file span{font-size:12.5px;color:var(--muted)}
.soon{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}


.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img.me{object-fit:cover;background:var(--soft)}
.lead{color:var(--muted);margin:2px 0 0;max-width:46ch}
.members{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtile{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--navy);color:var(--on-navy);border:0;border-radius:14px;padding:14px;min-width:0}
.mtile .eyebrow{color:inherit;opacity:.75}
.mtile b{font-family:var(--f-display);font-size:17px;line-height:1.15}
.mtile span:last-child{font-size:12.5px;opacity:.8}
.mtile:hover{outline:2px solid var(--gold);outline-offset:-2px}
@media (max-width:380px){.members{grid-template-columns:1fr}}

.del{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 4px;text-decoration:underline;text-underline-offset:2px}
.del.warn{color:var(--c-consejeras);font-weight:600}

.chat{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px;
  height:min(56vh,520px);overflow-y:auto;overscroll-behavior:contain}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg.own{margin-left:auto;flex-direction:row-reverse}
.msg{flex:none}
.av.sm{width:28px;height:28px;font-size:10.5px}
.bubble{background:var(--soft);border-radius:14px 14px 14px 4px;padding:8px 12px;min-width:0}
.msg.own .bubble{background:var(--navy);color:var(--on-navy);border-radius:14px 14px 4px 14px}
.bubble b{font-size:12.5px;display:block;color:var(--pc)}
.bubble p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .hm{display:block;font-size:11px;opacity:.7;margin-top:2px;text-align:right}
.msg.own .del{color:inherit}
.daysep{display:flex;justify-content:center}
.daysep span{font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 10px;text-transform:capitalize}
.empty{margin:auto;text-align:center;display:flex;flex-direction:column;gap:4px;max-width:30ch}
.empty span{color:var(--muted);font-size:13.5px}
.chatbar{display:flex;gap:8px}
.chatbar input,.search,.field input,.field select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 14px;font:inherit}
.chatbar input:focus-visible,.search:focus-visible,.field input:focus-visible,.field select:focus-visible{outline:2px solid var(--pc);outline-offset:1px}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.search{flex:1 1 200px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
.by{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.by .av.sm{width:24px;height:24px;font-size:9.5px}
th{text-align:left;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:11px 12px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:top}
td b{font-weight:600}
tr.example td{color:var(--muted)}
.nowrap{white-space:nowrap;font-variant-numeric:tabular-nums}
.none{text-align:center;color:var(--muted)}
.exchip{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px;white-space:nowrap}
.mode{font-size:12.5px;background:var(--soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.disc{font-family:var(--f-display);font-weight:700;white-space:nowrap}
.sel{user-select:all;overflow-wrap:anywhere}
td a{color:var(--ink);font-weight:600;white-space:nowrap}
.addform{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.addform summary{cursor:pointer;font-weight:700;padding:10px 0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:4px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select{border-radius:10px}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,460px);z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2)}

.ph{object-fit:cover;padding:0}
span.av{display:grid;place-items:center}
.cta{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--pc);border-radius:14px;padding:14px}
.cta div{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 220px}
.cta span{font-size:13.5px;color:var(--muted)}
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ficha h2{font-size:18px}
.photoedit{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.photobtns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hint{font-size:12px;color:var(--muted)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);display:inline-block}
.btn.ghost:focus-within,.photobtns input:focus-visible + .btn{outline:2px solid var(--pc)}
.bigav{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--soft);display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--pc)}
.bigav img{width:100%;height:100%;object-fit:cover;display:block}
.bigav span{font-family:var(--f-display);font-weight:700;font-size:28px;color:var(--muted)}
.bigav.sm{width:64px;height:64px;margin-bottom:4px}
.bigav.sm span{font-size:20px}
.row2{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px}
.person.mine{border-color:var(--pc)}
.person.example{opacity:.75}
.person .exchip{align-self:flex-start}
.plinks{display:flex;gap:10px;align-items:center;margin-top:auto}
.plinks a{color:var(--ink);font-weight:600;font-size:13px}

.demo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:6px 12px;color:var(--muted)}
.demo b{color:var(--ink)}
.linkbtn{border:0;background:transparent;color:var(--ink);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:2px;padding:4px 0}
.linkbtn.warn{color:var(--c-consejeras)}
.tright{display:flex;gap:8px;align-items:center}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.bell.open{border-color:var(--navy)}
.bell .badge{position:absolute;top:-4px;right:-6px}
.mebtn{border:0;background:transparent;padding:0;border-radius:50%}
.mebtn .me{width:36px;height:36px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-weight:700;font-size:12px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--c-consejeras);color:#fff;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.tab .badge{margin-left:6px;vertical-align:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(16,27,48,.12)}
.prow{display:flex;gap:14px;align-items:center;justify-content:space-between}
.prow div{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow span{font-size:13px;color:var(--muted)}
.switch{flex:none;width:48px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;transition:background .15s}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--navy)}
:root[data-theme="dark"] .switch[aria-checked="true"]{background:var(--c-promociona)}
.switch[aria-checked="true"] span{transform:translateX(20px)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li + li{border-top:1px solid var(--line)}
.plist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:transparent;padding:10px 2px;text-align:left}
.pname{display:flex;flex-direction:column;font-weight:600}
.pname small{font-weight:400;color:var(--muted);font-size:12.5px}
.pempty,.pnote{margin:0;font-size:13px;color:var(--muted)}
.logins{display:flex;flex-direction:column;gap:8px}
.logincard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%}
.logincard.cur{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.logincard .av{width:44px;height:44px}
.logincard .t{min-width:0;display:flex;flex-direction:column}
.logincard .t span{font-size:13px;color:var(--muted)}
.livecard.locked{opacity:.72}
.lockico{color:var(--muted);display:grid;place-items:center}
.ed{position:relative}
.ed.locked{color:var(--muted);background:var(--soft)}
.ed.own{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.ed small svg{vertical-align:-2px}
.ed .badge{position:absolute;top:-6px;right:-6px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.lockcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.lockcard p{margin:0;color:var(--muted);max-width:48ch}
.lockbig{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink)}
.lockbig svg{width:20px;height:20px}
.mypromos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chatlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.chatlist li + li{border-top:1px solid var(--line)}
.chatrow{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border:0;background:transparent;padding:12px 14px;text-align:left}
.cicon .logo,.cicon .grp{width:44px;height:44px;border-radius:50%}
.cicon .logo{background:#fff}
.grp{display:grid;place-items:center;background:var(--soft);font-weight:700;font-size:14px;color:var(--ink)}
.chatrow .t{min-width:0;display:flex;flex-direction:column}
.chatrow .t span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cmeta small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dotun{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.mutedtag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.btn.wide{width:100%;padding:11px}
.chathead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.chathead .t{display:flex;flex-direction:column;min-width:0}
.chathead .t span{font-size:12.5px;color:var(--muted)}
.back.sm{padding:6px 12px}
.mute{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.mute.off{color:var(--muted)}
.mute svg{width:16px;height:16px}
.pick{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:0;display:flex;flex-direction:column}
.pick legend{font-size:12.5px;color:var(--muted);font-weight:600;padding:0 4px}
.pickrow{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer}
.pickrow + .pickrow{border-top:1px solid var(--line)}
.pickrow input{width:18px;height:18px;accent-color:var(--navy)}

.app{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left, 0px));box-shadow:0 -4px 16px rgba(16,27,48,.06)}
.nav-it{position:relative;flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;padding:6px 4px;border-radius:10px}
.nav-it.on{color:var(--ink);background:var(--soft)}
.nav-it .badge{position:absolute;top:0;left:calc(50% + 6px)}
.cprom{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.04em}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
footer{font-size:12px;color:var(--muted);text-align:center;padding-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

function toPhoto(file){return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type))return rej(new Error('type'));
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const S=240,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
    const m=Math.min(img.naturalWidth,img.naturalHeight);x.fillStyle='#fff';x.fillRect(0,0,S,S);
    x.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,S,S);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load'))};img.src=url})}

function render(keep){
  if(!me()&&state.view!=='login')state.view='login';
  let saved=[],act=null,sS=0,sE=0,openD=false;
  if(keep){saved=[...app.querySelectorAll('input,textarea,select')].filter(el=>el.id&&el.type!=='file'&&el.type!=='checkbox').map(el=>[el.id,el.value]);
    const checks=[...app.querySelectorAll('input[type=checkbox]:checked')].map(el=>el.value);saved.push(['__checks',checks]);
    const a=document.activeElement;if(a&&a.id&&app.contains(a)){act=a.id;try{sS=a.selectionStart;sE=a.selectionEnd}catch(e){}}
    openD=!!app.querySelector('details[open]')}
  if(state.view==='edition'&&state.tab==='chat'&&state.chat&&me()){const c=chatById(state.chat);if(c&&inChat(me(),c)){D.lastRead[D.current]=D.lastRead[D.current]||{};D.lastRead[D.current][c.id]=Date.now();save()}}
  const v=state.view;
  app.style.setProperty('--pc',state.prog?`var(--c-${state.prog})`:'var(--c-promociona)');
  app.innerHTML=(v==='login'?login():v==='chats'?chatsPage():v==='home'?home():v==='program'?program():v==='jobs'?jobs():v==='perks'?perks():edition())+navbar();
  for(const[id,val]of saved){if(id==='__checks'){app.querySelectorAll('input[type=checkbox]').forEach(el=>{if(val.includes(el.value))el.checked=true});continue}
    const el=document.getElementById(id);if(el)el.value=val}
  if(openD){const d=app.querySelector('details');if(d)d.open=true}
  if(act){const el=document.getElementById(act);if(el){el.focus();try{el.setSelectionRange(sS,sE)}catch(e){}}}
  bind();
  const log=document.getElementById('chatlog');if(log)log.scrollTop=log.scrollHeight;
}

function bind(){
  const $=id=>document.getElementById(id);
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
  on('back',()=>state.view==='edition'?go({view:'program',ed:null,chat:null}):go({view:'home',prog:null}));
  on('switch',()=>go({view:'login',prog:null,ed:null,chat:null,resetArm:false}));
  on('mebtn',()=>go({view:'login',prog:null,ed:null,chat:null,resetArm:false}));
  on('bell',()=>{state.panel=!state.panel;render(true)});
  on('notif-toggle',()=>{const n=notifOf(D.current);n.on=!n.on;save();render(true)});
  on('reset',()=>{if(!state.resetArm){state.resetArm=true;render(false);return}
    D=seed();save();state.resetArm=false;toast('Demo reiniciada');go({view:'login'})});
  app.querySelectorAll('[data-login]').forEach(el=>el.onclick=()=>{D.current=el.dataset.login;save();go({view:'home',prog:null,ed:null})});
  app.querySelectorAll('[data-prog]').forEach(el=>el.onclick=()=>go({view:'program',prog:el.dataset.prog}));
  app.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go({view:el.dataset.go,prog:null}));
  app.querySelectorAll('[data-ed]').forEach(el=>el.onclick=()=>{const k=el.dataset.ed;go({view:'edition',prog:keyProg(k),ed:keyNum(k),tab:'sala',chat:null})});
  app.querySelectorAll('[data-openchat]').forEach(el=>el.onclick=()=>{const c=chatById(el.dataset.openchat);go({view:'edition',prog:keyProg(c.key),ed:keyNum(c.key),tab:'chat',chat:c.id})});
  app.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab;state.chat=null;state.newChat=false;state.editing=false;pendingPhoto=null;render(false)});
  app.querySelectorAll('[data-chat]').forEach(el=>el.onclick=()=>{state.chat=el.dataset.chat;state.newChat=false;render(false)});
  on('chatback',()=>{state.chat=null;render(false)});
  app.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>go({view:el.dataset.nav,prog:null,ed:null,chat:null}));
  app.querySelectorAll('[data-newchat]').forEach(el=>el.onclick=()=>{const k=el.dataset.newchat;go({view:'edition',prog:keyProg(k),ed:keyNum(k),tab:'chat',chat:null});state.newChat=true;render(false)});
  on('mute',()=>{const n=notifOf(D.current),c=state.chat;n.muted[c]=!n.muted[c];save();toast(n.muted[c]?'Avisos desactivados para este chat':'Avisos activados para este chat');render(true)});
  on('nc-open',()=>{state.newChat=true;render(false);const f=$('nc-name');if(f)f.focus()});
  on('nc-cancel',()=>{state.newChat=false;render(false)});
  const nc=$('newchat');
  if(nc)nc.onsubmit=e=>{e.preventDefault();const name=$('nc-name').value.trim();const mem=[...nc.querySelectorAll('input[name=nc-m]:checked')].map(x=>x.value);
    if(!name)return;if(!mem.length){toast('Elige al menos una compañera para el chat.');return}
    const key=`${state.prog}-${state.ed}`,id='c-'+uidGen();
    D.chats.push({id,key,name,members:[D.current,...mem],createdBy:D.current,ts:Date.now()});save();
    state.newChat=false;state.chat=id;toast('Chat creado');render(false)};
  const delWith=(attr,arr)=>app.querySelectorAll(`[data-${attr}]`).forEach(el=>el.onclick=()=>{
    if(el.dataset.armed!=='1'){el.dataset.armed='1';el.textContent='¿Seguro?';el.classList.add('warn');return}
    D[arr]=D[arr].filter(x=>x.id!==el.dataset[attr]);save();render(true)});
  delWith('delpost','posts');delWith('delmsg','msgs');delWith('deljob','ofertas');delWith('delperk','ventajas');
  app.querySelectorAll('[data-jf]').forEach(el=>el.onclick=()=>{state.jf=el.dataset.jf;render(true)});
  const jq=$('jq');if(jq)jq.oninput=()=>{state.jq=jq.value;render(true)};
  const t=$('txt'),s=$('send');
  if(t){const upd=()=>{s.disabled=!t.value.trim()};upd();t.oninput=upd;
    s.onclick=()=>{const v=t.value.trim();if(!v)return;D.posts.push({id:uidGen(),key:`${state.prog}-${state.ed}`,uid:D.current,text:v.slice(0,2000),ts:Date.now()});save();t.value='';render(true)}}
  const cf=$('chatform');
  if(cf)cf.onsubmit=e=>{e.preventDefault();const inp=$('chatin'),v=inp.value.trim();if(!v)return;const c=chatById(state.chat);
    D.msgs.push({id:uidGen(),chat:c.id,uid:D.current,text:v.slice(0,1000),ts:Date.now()});save();inp.value='';render(true);simulateReply(c)};
  const jf=$('jobform');
  if(jf)jf.onsubmit=e=>{e.preventDefault();const g=id=>$(id).value.trim();
    D.ofertas.push({id:uidGen(),puesto:g('j-puesto'),empresa:g('j-empresa'),lugar:g('j-lugar'),modalidad:g('j-modalidad'),enlace:g('j-enlace'),uid:D.current,ts:Date.now()});save();
    jf.reset();toast('Oferta publicada');render(false)};
  const pf=$('perkform');
  if(pf)pf.onsubmit=e=>{e.preventDefault();const g=id=>$(id).value.trim();
    D.ventajas.push({id:uidGen(),titulo:g('v-titulo'),proveedor:g('v-proveedor'),descuento:g('v-descuento'),para:g('v-para'),condiciones:g('v-condiciones'),uid:D.current,ts:Date.now()});save();
    pf.reset();toast('Ventaja añadida');render(false)};
  on('f-open',()=>{state.editing=true;pendingPhoto=null;render(false)});
  on('f-edit',()=>{state.editing=true;pendingPhoto=null;render(false)});
  on('f-cancel',()=>{state.editing=false;pendingPhoto=null;render(false)});
  on('f-nofoto',()=>{pendingPhoto='none';render(true)});
  const ff=$('f-foto');
  if(ff)ff.onchange=async()=>{const f=ff.files&&ff.files[0];if(!f)return;try{pendingPhoto=await toPhoto(f);render(true)}catch(e){toast('No se ha podido leer la imagen. Prueba con una foto JPG o PNG.')}};
  const fform=$('fichaform');
  if(fform)fform.onsubmit=e=>{e.preventDefault();const g=id=>$(id).value.trim();const li=g('f-linkedin');
    if(li&&!safeLink(li)){toast('El enlace de LinkedIn debe empezar por https://www.linkedin.com/');return}
    const cur=D.profiles[D.current]||{};const nx={...cur,cargo:g('f-cargo'),empresa:g('f-empresa'),linkedin:li};
    if(pendingPhoto==='none')delete nx.foto;else if(pendingPhoto)nx.foto=pendingPhoto;
    D.profiles[D.current]=nx;save();state.editing=false;pendingPhoto=null;toast('Ficha guardada');render(false)};
}
render(false);
</script>

</body>
</html>
